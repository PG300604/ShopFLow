server:
  port: ${PORT:8082}

spring:
  application:
    name: order-service
  profiles:
    active: mock
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shopflow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

shopflow:
  internal-key: ${SHOPFLOW_INTERNAL_KEY:shopflow-internal-secure-key-2026}

jwt:
  secret: ${JWT_SECRET:9a4f2c8d3b7a1e5f8g9h0i1j2k3l4m5n6o7p8q9r0s1t2u3v4w5x6y7z8a9b0c1d}
