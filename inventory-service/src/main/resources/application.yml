server:
  port: 8085

spring:
  application:
    name: inventory-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shopflow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

shopflow:
  internal-key: ${SHOPFLOW_INTERNAL_KEY:shopflow-internal-secure-key-2026}

jwt:
  secret: ${JWT_SECRET:ShopFlowDefaultJwtSecretKeyForDev2026Base64StringLengthMinimum256Bits!}
