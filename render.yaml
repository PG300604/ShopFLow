services:
  # ─── 1. Eureka Service Registry ───
  - type: web
    name: shopflow-eureka
    env: docker
    dockerfilePath: eureka-server/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8761
      - key: EUREKA_CLIENT_REGISTER_WITH_EUREKA
        value: "false"
      - key: EUREKA_CLIENT_FETCH_REGISTRY
        value: "false"

  # ─── 2. Spring Cloud API Gateway (Public Web Entrypoint) ───
  - type: web
    name: shopflow-gateway
    env: docker
    dockerfilePath: api-gateway/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
        fromService:
          type: web
          name: shopflow-eureka
          property: host
          format: "http://{host}:8761/eureka/"

  # ─── 3. Auth Service ───
  - type: web
    name: shopflow-auth
    env: docker
    dockerfilePath: auth-service/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8081
      - fromGroup: shopflow-shared-env
      - key: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
        fromService:
          type: web
          name: shopflow-eureka
          property: host
          format: "http://{host}:8761/eureka/"

  # ─── 4. Product Service ───
  - type: web
    name: shopflow-product
    env: docker
    dockerfilePath: product-service/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8082
      - fromGroup: shopflow-shared-env
      - key: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
        fromService:
          type: web
          name: shopflow-eureka
          property: host
          format: "http://{host}:8761/eureka/"

  # ─── 5. Order Service ───
  - type: web
    name: shopflow-order
    env: docker
    dockerfilePath: order-service/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8083
      - fromGroup: shopflow-shared-env
      - key: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
        fromService:
          type: web
          name: shopflow-eureka
          property: host
          format: "http://{host}:8761/eureka/"

  # ─── 6. Inventory Service ───
  - type: web
    name: shopflow-inventory
    env: docker
    dockerfilePath: inventory-service/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8085
      - fromGroup: shopflow-shared-env
      - key: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
        fromService:
          type: web
          name: shopflow-eureka
          property: host
          format: "http://{host}:8761/eureka/"

  # ─── 7. Payment Service ───
  - type: web
    name: shopflow-payment
    env: docker
    dockerfilePath: payment-service/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8084
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
        fromService:
          type: web
          name: shopflow-eureka
          property: host
          format: "http://{host}:8761/eureka/"

  # ─── 8. Notification Service ───
  - type: web
    name: shopflow-notification
    env: docker
    dockerfilePath: notification-service/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8086
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: 2525
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
        fromService:
          type: web
          name: shopflow-eureka
          property: host
          format: "http://{host}:8761/eureka/"

envVarGroups:
  - name: shopflow-shared-env
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
